# ==============================================================================
# Flyway Configuration for AgriVoice-AI (SQLite)
# ==============================================================================

# JDBC connection URL to SQLite database
# Note: Database file will be stored in data/agrivoice.db
flyway.url=jdbc:sqlite:data/agrivoice.db

# Path to SQL migration scripts
flyway.locations=filesystem:src/db/migration

# History table name (tracks applied migrations)
flyway.table=flyway_schema_history

# File naming conventions
flyway.sqlMigrationPrefix=V
flyway.sqlMigrationSeparator=__
flyway.sqlMigrationSuffixes=.sql
flyway.encoding=UTF-8

# Allow out-of-order migrations during development if needed
flyway.outOfOrder=false

# Validate migration checksums on migrate
flyway.validateOnMigrate=true

# Allow baseline on migrate for existing databases
flyway.baselineOnMigrate=true
flyway.baselineVersion=0
flyway.baselineDescription=Base Schema

# Disable clean in production environments
flyway.cleanDisabled=false
